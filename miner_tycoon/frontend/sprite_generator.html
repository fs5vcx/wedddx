<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>精灵图生成器</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        canvas {
            border: 2px solid #444;
            background: #2a2a4a;
        }
        #preview {
            display: grid;
            grid-template-columns: repeat(6, 128px);
            gap: 4px;
            margin-top: 20px;
        }
        .sprite-preview {
            width: 128px;
            height: 128px;
            background: #2a2a4a;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .sprite-label {
            position: absolute;
            bottom: 2px;
            left: 2px;
            right: 2px;
            font-size: 10px;
            color: #888;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 1px 2px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #status {
            margin: 10px 0;
            padding: 10px;
            background: #333;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>🎮 游戏精灵图生成器</h1>
    <div id="status">准备生成精灵图...</div>
    <button id="generate-btn">生成精灵图</button>
    <button id="download-btn" disabled>下载 PNG</button>
    <button id="download-css-btn" disabled>下载 CSS</button>
    
    <div id="canvas-container">
        <div>
            <h3>精灵图 (768 x 1024)</h3>
            <canvas id="sprite-canvas" width="768" height="1024"></canvas>
        </div>
    </div>
    
    <h3>预览 (48个精灵)</h3>
    <div id="preview"></div>

    <script>
        const SPRITE_SIZE = 128;
        const COLS = 6;
        const ROWS = 8;
        
        const SPRITES = [
            { key: 'miner_idle', row: 0, col: 0, draw: drawMinerIdle },
            { key: 'miner_mining', row: 0, col: 1, draw: drawMinerMining },
            { key: 'miner_walk', row: 0, col: 2, draw: drawMinerWalk },
            { key: 'miner2_idle', row: 0, col: 3, draw: (ctx,x,y,s) => drawMinerIdle(ctx,x,y,s,'#FF9800','#4CAF50') },
            { key: 'miner2_mining', row: 0, col: 4, draw: (ctx,x,y,s) => drawMinerMining(ctx,x,y,s,'#FF9800','#4CAF50') },
            { key: 'miner3_idle', row: 0, col: 5, draw: (ctx,x,y,s) => drawMinerIdle(ctx,x,y,s,'#E91E63','#795548') },
            
            { key: 'elevator_worker_idle', row: 1, col: 0, draw: drawElevatorWorker },
            { key: 'elevator_worker_working', row: 1, col: 1, draw: drawElevatorWorkerWorking },
            { key: 'ground_worker_idle', row: 1, col: 2, draw: drawGroundWorker },
            { key: 'ground_worker_pushing', row: 1, col: 3, draw: drawGroundWorkerPushing },
            { key: 'supervisor_miner', row: 1, col: 4, draw: drawSupervisor },
            { key: 'supervisor_elevator', row: 1, col: 5, draw: (ctx,x,y,s) => drawSupervisor(ctx,x,y,s,'#2196F3') },
            
            { key: 'elevator_closed', row: 2, col: 0, draw: drawElevatorClosed },
            { key: 'elevator_open', row: 2, col: 1, draw: drawElevatorOpen },
            { key: 'minecart_empty', row: 2, col: 2, draw: drawMinecartEmpty },
            { key: 'minecart_full', row: 2, col: 3, draw: drawMinecartFull },
            { key: 'pickaxe_iron', row: 2, col: 4, draw: drawPickaxeIron },
            { key: 'pickaxe_gold', row: 2, col: 5, draw: drawPickaxeGold },
            
            { key: 'ore_gold', row: 3, col: 0, draw: (ctx,x,y,s) => drawOre(ctx,x,y,s,'#FFD700','#FFA000') },
            { key: 'ore_copper', row: 3, col: 1, draw: (ctx,x,y,s) => drawOre(ctx,x,y,s,'#FF8A65','#E64A19') },
            { key: 'ore_silver', row: 3, col: 2, draw: (ctx,x,y,s) => drawOre(ctx,x,y,s,'#E0E0E0','#9E9E9E') },
            { key: 'ore_diamond', row: 3, col: 3, draw: (ctx,x,y,s) => drawOre(ctx,x,y,s,'#64B5F6','#1976D2') },
            { key: 'ore_ruby', row: 3, col: 4, draw: (ctx,x,y,s) => drawOre(ctx,x,y,s,'#EF5350','#C62828') },
            { key: 'ore_emerald', row: 3, col: 5, draw: (ctx,x,y,s) => drawOre(ctx,x,y,s,'#66BB6A','#2E7D32') },
            
            { key: 'icon_gold', row: 4, col: 0, draw: drawIconGold },
            { key: 'icon_gem', row: 4, col: 1, draw: drawIconGem },
            { key: 'icon_cash', row: 4, col: 2, draw: drawIconCash },
            { key: 'icon_settings', row: 4, col: 3, draw: drawIconSettings },
            { key: 'icon_music', row: 4, col: 4, draw: drawIconMusic },
            { key: 'icon_pickaxe', row: 4, col: 5, draw: drawIconPickaxe },
            
            { key: 'icon_elevator', row: 5, col: 0, draw: drawIconElevator },
            { key: 'icon_factory', row: 5, col: 1, draw: drawIconFactory },
            { key: 'icon_mountain', row: 5, col: 2, draw: drawIconMountain },
            { key: 'icon_lock', row: 5, col: 3, draw: drawIconLock },
            { key: 'icon_check', row: 5, col: 4, draw: drawIconCheck },
            { key: 'icon_star', row: 5, col: 5, draw: drawIconStar },
            
            { key: 'tower_blue', row: 6, col: 0, draw: (ctx,x,y,s) => drawTower(ctx,x,y,s,'#42A5F5','#1565C0') },
            { key: 'tower_green', row: 6, col: 1, draw: (ctx,x,y,s) => drawTower(ctx,x,y,s,'#66BB6A','#2E7D32') },
            { key: 'elevator_top', row: 6, col: 2, draw: drawElevatorTop },
            { key: 'mine_tunnel', row: 6, col: 3, draw: drawMineTunnel },
            { key: 'mine_lamp', row: 6, col: 4, draw: drawMineLamp },
            { key: 'flag_red', row: 6, col: 5, draw: drawFlagRed },
            
            { key: 'effect_mining_1', row: 7, col: 0, draw: drawMiningEffect1 },
            { key: 'effect_mining_2', row: 7, col: 1, draw: drawMiningEffect2 },
            { key: 'effect_mining_3', row: 7, col: 2, draw: drawMiningEffect3 },
            { key: 'effect_gold_1', row: 7, col: 3, draw: drawGoldEffect1 },
            { key: 'effect_gold_2', row: 7, col: 4, draw: drawGoldEffect2 },
            { key: 'effect_sparkle', row: 7, col: 5, draw: drawSparkleEffect },
        ];
        
        const canvas = document.getElementById('sprite-canvas');
        const ctx = canvas.getContext('2d');
        const preview = document.getElementById('preview');
        const statusEl = document.getElementById('status');
        
        document.getElementById('generate-btn').addEventListener('click', generateSprites);
        document.getElementById('download-btn').addEventListener('click', downloadPNG);
        document.getElementById('download-css-btn').addEventListener('click', downloadCSS);
        
        function generateSprites() {
            statusEl.textContent = '正在生成精灵图...';
            document.getElementById('generate-btn').disabled = true;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            preview.innerHTML = '';
            
            let done = 0;
            
            SPRITES.forEach((sprite, index) => {
                const x = sprite.col * SPRITE_SIZE;
                const y = sprite.row * SPRITE_SIZE;
                
                ctx.save();
                ctx.translate(x, y);
                sprite.draw(ctx, 0, 0, SPRITE_SIZE);
                ctx.restore();
                
                const div = document.createElement('div');
                div.className = 'sprite-preview';
                const cvs = document.createElement('canvas');
                cvs.width = SPRITE_SIZE;
                cvs.height = SPRITE_SIZE;
                const pctx = cvs.getContext('2d');
                pctx.drawImage(canvas, x, y, SPRITE_SIZE, SPRITE_SIZE, 0, 0, SPRITE_SIZE, SPRITE_SIZE);
                div.appendChild(cvs);
                const label = document.createElement('div');
                label.className = 'sprite-label';
                label.textContent = sprite.key;
                div.appendChild(label);
                preview.appendChild(div);
                
                done++;
                statusEl.textContent = `生成中... ${done}/${SPRITES.length}`;
            });
            
            statusEl.textContent = `✅ 生成完成！共 ${SPRITES.length} 个精灵`;
            document.getElementById('download-btn').disabled = false;
            document.getElementById('download-css-btn').disabled = false;
            document.getElementById('generate-btn').disabled = false;
        }
        
        function downloadPNG() {
            const link = document.createElement('a');
            link.download = 'sprites.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        function downloadCSS() {
            let css = `/* 游戏精灵图 CSS */
.sprite {
    background-image: url('sprites.png');
    background-size: ${COLS * SPRITE_SIZE}px ${ROWS * SPRITE_SIZE}px;
    width: ${SPRITE_SIZE}px;
    height: ${SPRITE_SIZE}px;
    display: inline-block;
}

`;
            SPRITES.forEach(sprite => {
                const x = sprite.col * SPRITE_SIZE;
                const y = sprite.row * SPRITE_SIZE;
                css += `.sprite-${sprite.key} {
    background-position: -${x}px -${y}px;
}

`;
            });
            
            const blob = new Blob([css], { type: 'text/css' });
            const link = document.createElement('a');
            link.download = 'sprites.css';
            link.href = URL.createObjectURL(blob);
            link.click();
        }
        
        // ===== 绘制函数 =====
        
        function drawMinerIdle(ctx, x, y, size, helmetColor='#FFD700', bodyColor='#4169E1') {
            const s = size / 128;
            ctx.save();
            ctx.translate(x + size/2, y + size*0.15);
            ctx.scale(s, s);
            
            ctx.fillStyle = bodyColor;
            ctx.strokeStyle = adjustColor(bodyColor, -40);
            ctx.lineWidth = 3;
            roundRect(ctx, -18, 20, 36, 30, 5);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#FFDAB9';
            ctx.strokeStyle = '#DEB887';
            roundRect(ctx, -14, -2, 28, 22, 6);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-5, 6, 2.5, 0, Math.PI*2);
            ctx.arc(5, 6, 2.5, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = helmetColor;
            ctx.strokeStyle = adjustColor(helmetColor, -50);
            ctx.beginPath();
            ctx.ellipse(0, -8, 20, 14, 0, Math.PI, 0);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#FFFF00';
            ctx.beginPath();
            ctx.arc(0, -5, 7, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#FFA500';
            ctx.stroke();
            
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(-10, 22, 20, 6);
            
            ctx.restore();
        }
        
        function drawMinerMining(ctx, x, y, size, helmetColor='#FFD700', bodyColor='#4169E1') {
            const s = size / 128;
            ctx.save();
            ctx.translate(x + size/2, y + size*0.15);
            ctx.scale(s, s);
            ctx.rotate(-0.2);
            
            ctx.fillStyle = bodyColor;
            ctx.strokeStyle = adjustColor(bodyColor, -40);
            ctx.lineWidth = 3;
            roundRect(ctx, -18, 20, 36, 30, 5);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#FFDAB9';
            ctx.strokeStyle = '#DEB887';
            roundRect(ctx, -14, -2, 28, 22, 6);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-5, 6, 2.5, 0, Math.PI*2);
            ctx.arc(5, 6, 2.5, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = helmetColor;
            ctx.strokeStyle = adjustColor(helmetColor, -50);
            ctx.beginPath();
            ctx.ellipse(0, -8, 20, 14, 0, Math.PI, 0);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#FFFF00';
            ctx.beginPath();
            ctx.arc(0, -5, 7, 0, Math.PI*2);
            ctx.fill();
            
            ctx.save();
            ctx.translate(22, 10);
            ctx.rotate(-0.5);
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(-2, 0, 4, 35);
            ctx.fillStyle = '#C0C0C0';
            ctx.strokeStyle = '#707070';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-14, -8);
            ctx.lineTo(14, -8);
            ctx.lineTo(10, 2);
            ctx.lineTo(-10, 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
            
            ctx.restore();
        }
        
        function drawMinerWalk(ctx, x, y, size) {
            drawMinerIdle(ctx, x, y, size);
        }
        
        function drawElevatorWorker(ctx, x, y, size) {
            const s = size / 128;
            ctx.save();
            ctx.translate(x + size/2, y + size*0.1);
            ctx.scale(s, s);
            
            ctx.fillStyle = '#2196F3';
            ctx.strokeStyle = '#0D47A1';
            ctx.lineWidth = 3;
            roundRect(ctx, -20, 25, 40, 35, 6);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#FFDAB9';
            ctx.strokeStyle = '#DEB887';
            ctx.beginPath();
            ctx.arc(0, 8, 18, 0, Math.PI*2);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-6, 5, 3, 0, Math.PI*2);
            ctx.arc(6, 5, 3, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#FF9800';
            ctx.strokeStyle = '#E65100';
            ctx.beginPath();
            ctx.ellipse(0, -6, 22, 15, 0, Math.PI, 0);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#FFEB3B';
            ctx.beginPath();
            ctx.arc(0, -3, 8, 0, Math.PI*2);
            ctx.fill();
            
            ctx.restore();
        }
        
        function drawElevatorWorkerWorking(ctx, x, y, size) {
            drawElevatorWorker(ctx, x, y, size);
            const s = size / 128;
            ctx.save();
            ctx.translate(x + size/2 - 25*s, y + size*0.45);
            ctx.scale(s, s);
            ctx.fillStyle = '#444';
            roundRect(ctx, 0, 0, 25, 30, 3);
            ctx.fill();
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.arc(8, 10, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#F44336';
            ctx.beginPath();
            ctx.arc(17, 10, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }
        
        function drawGroundWorker(ctx, x, y, size) {
            const s = size / 128;
            ctx.save();
            ctx.translate(x + size/2, y + size*0.15);
            ctx.scale(s, s);
            
            ctx.fillStyle = '#4CAF50';
            ctx.strokeStyle = '#1B5E20';
            ctx.lineWidth = 3;
            roundRect(ctx, -18, 20, 36, 32, 5);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#FFDAB9';
            ctx.strokeStyle = '#DEB887';
            roundRect(ctx, -14, -2, 28, 22, 6);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-5, 6, 2.5, 0, Math.PI*2);
            ctx.arc(5, 6, 2.5, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#FFC107';
            ctx.strokeStyle = '#FF8F00';
            ctx.beginPath();
            ctx.ellipse(0, -8, 20, 14, 0, Math.PI, 0);
            ctx.fill();
            ctx.stroke();
            
            ctx.restore();
        }
        
        function drawGroundWorkerPushing(ctx, x, y, size) {
            drawGroundWorker(ctx, x - 10, y, size);
            const s = size / 128;
            ctx.save();
            ctx.translate(x + size*0.6, y + size*0.5);
            ctx.scale(s, s);
            ctx.fillStyle = '#E53935';
            ctx.strokeStyle = '#B71C1C';
            ctx.lineWidth = 2.5;
            roundRect(ctx, 0, -12, 30, 20, 3);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(8, 10, 6, 0, Math.PI*2);
            ctx.arc(22, 10, 6, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }
        
        function drawSupervisor(ctx, x, y, size, suitColor='#9C27B0') {
            const s = size / 128;
            ctx.save();
            ctx.translate(x + size/2, y + size*0.12);
            ctx.scale(s, s);
            
            ctx.fillStyle = suitColor;
            ctx.strokeStyle = adjustColor(suitColor, -40);
            ctx.lineWidth = 3;
            roundRect(ctx, -20, 22, 40, 35, 5);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = 'white';
            ctx.fillRect(-12, 22, 24, 10);
            
            ctx.fillStyle = '#FFDAB9';
            ctx.strokeStyle = '#DEB887';
            ctx.beginPath();
            ctx.arc(0, 6, 17, 0, Math.PI*2);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-5, 4, 2.5, 0, Math.PI*2);
            ctx.arc(5, 4, 2.5, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#5D4037';
            ctx.beginPath();
            ctx.ellipse(0, -8, 20, 10, 0, Math.PI, 0);
            ctx.fill();
            ctx.fillRect(-25, -8, 50, 4);
            
            ctx.fillStyle = '#FFF8E1';
            ctx.strokeStyle = '#8D6E63';
            ctx.lineWidth = 1.5;
            roundRect(ctx, 18, 28, 18, 22, 2);
            ctx.fill();
            ctx.stroke();
            
            ctx.restore();
        }
        
        function drawElevatorClosed(ctx, x, y, size) {
            const s = size / 128;
            ctx.save();
            ctx.translate(x + size/2, y + size/2);
            ctx.scale(s, s);
            
            ctx.fillStyle = '#607D8B';
            ctx.strokeStyle = '#37474F';
            ctx.lineWidth = 4;
            roundRect(ctx, -35, -45, 70, 90, 5);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#90A4AE';
            ctx.fillRect(-30, -40, 28, 80);
            ctx.fillRect(2, -40, 28, 80);
            
            ctx.strokeStyle = '#455A64';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -40);
            ctx.lineTo(0, 40);
            ctx.stroke();
            
            ctx.fillStyle = '#FFC107';
            ctx.beginPath();
            ctx.arc(0, -52, 6, 0, Math.PI*2);
            ctx.fill();
            
            ctx.restore();
        }
        
        function drawElevatorOpen(ctx, x, y, size) {
            const s = size / 128;
            ctx.save();
            ctx.translate(x + size/2, y + size/2);
            ctx.scale(s, s);
            
            ctx.fillStyle = '#607D8B';
            ctx.strokeStyle = '#37474F';
            ctx.lineWidth = 4;
            roundRect(ctx, -35, -45, 70, 90, 5);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#263238';
            ctx.fillRect(-28, -38, 56, 76);
            
            ctx.fillStyle = '#90A4AE';
            ctx.fillRect(-38, -40, 12, 80);
            ctx.fillRect(26, -40, 12, 80);
            
            ctx.fillStyle = '#FFC107';
            ctx.beginPath();
            ctx.arc(0, -52, 6, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#FFDAB9';
            ctx.beginPath();
            ctx.arc(0, 10, 12, 0, Math.PI*2);
            ctx.fill();
            
            ctx.restore();
        }
        
        function drawMinecartEmpty(ctx, x, y, size) {
            const s = size / 128;
            ctx.save();
            ctx.translate(x + size/2, y + size*0.55);
            ctx.scale(s, s);
            
            ctx.fillStyle = '#E53935';
            ctx.strokeStyle = '#B71C1C';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-35, -15);
            ctx.lineTo(-28, 15);
            ctx.lineTo(28, 15);
            ctx.lineTo(35, -15);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#B71C1C';
            ctx.fillRect(-35, -18, 70, 6);
            
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-18, 22, 10, 0, Math.PI*2);
            ctx.arc(18, 22, 10, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#666';
            ctx.beginPath();
            ctx.arc(-18, 22, 4, 0, Math.PI*2);
            ctx.arc(18, 22, 4, 0, Math.PI*2);
            ctx.fill();
            
            ctx.restore();
        }
        
        function drawMinecartFull(ctx, x, y, size) {
            drawMinecartEmpty(ctx, x, y, size);
            const s = size / 128;
            ctx.save();
            ctx.translate(x + size/2, y + size*0.4);
            ctx.scale(s, s);
            
            for (let i = 0; i < 5; i++) {
                const ox = -25 + i * 12;
                const oy = -10 - (i % 2) * 8;
                ctx.fillStyle = '#FFD700';
                ctx.strokeStyle = '#FFA000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(ox, oy - 10);
                ctx.lineTo(ox + 8, oy - 2);
                ctx.lineTo(ox + 6, oy + 8);
                ctx.lineTo(ox - 6, oy + 8);
                ctx.lineTo(ox - 8, oy - 2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        function drawPickaxeIron(ctx, x, y, size) {
            const s = size / 128;
            ctx.save();
            ctx.translate(x + size/2, y + size/2);
            ctx.scale(s, s);
            ctx.rotate(-0.4);
            
            ctx.fillStyle = '#8B4513';
            ctx.strokeStyle = '#5D4037';
            ctx.lineWidth = 2;
            roundRect(ctx, -4, -10, 8, 50, 2);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#B0BEC5';
            ctx.strokeStyle = '#455A64';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-30, -18);
            ctx.lineTo(30, -18);
            ctx.lineTo(22, -4);
            ctx.lineTo(-22, -4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            ctx.restore();
        }
        
        function drawPickaxeGold(ctx, x, y, size) {
            const s = size / 128;

            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI*2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#E65100';
            ctx.font = `bold ${r*0.7}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', x, y + r*0.05);
        }
        
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }
        
        function adjustColor(hex, amount) {
            const num = parseInt(hex.replace('#', ''), 16);
            let r = Math.max(0, Math.min(255, (num >> 16) + amount));
            let g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amount));
            let b = Math.max(0, Math.min(255, (num & 0x0000FF) + amount));
            return '#' + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }
        
        function lightenColor(hex, percent) {
            const num = parseInt(hex.replace('#', ''), 16);
            const r = Math.min(255, (num >> 16) + Math.floor(255 * percent / 100));
            const g = Math.min(255, ((num >> 8) & 0x00FF) + Math.floor(255 * percent / 100));
            const b = Math.min(255, (num & 0x0000FF) + Math.floor(255 * percent / 100));
            return '#' + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }
        
        window.onload = () => {
            generateSprites();
        };
    </script>
