<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>采矿大亨 - 掘金之旅</title>
    <link rel="stylesheet" href="assets/sprites.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 登录界面 -->
        <div id="auth-screen" class="auth-screen">
            <div class="auth-content">
                <div class="auth-logo-miner sprite sprite-miner_idle"></div>
                <h1>采矿大亨</h1>
                <p class="auth-subtitle">掘金之旅</p>
                <div class="auth-tabs">
                    <button class="tab-btn active" data-tab="login">登录</button>
                    <button class="tab-btn" data-tab="register">注册</button>
                </div>
                <form id="login-form" class="auth-form">
                    <input type="text" id="login-username" placeholder="用户名" required>
                    <input type="password" id="login-password" placeholder="密码" required>
                    <button type="submit" class="btn-primary">开始游戏</button>
                </form>
                <form id="register-form" class="auth-form" style="display:none;">
                    <input type="text" id="reg-username" placeholder="用户名" required>
                    <input type="password" id="reg-password" placeholder="密码" required>
                    <button type="submit" class="btn-primary">立即注册</button>
                </form>
            </div>
        </div>

        <!-- 游戏主界面 -->
        <div id="game-screen" class="game-screen hidden">
            <!-- 顶部资源栏 -->
            <div class="game-header">
                <button class="header-btn" id="btn-settings">⚙️</button>
                <div class="header-resources">
                    <div class="res-item gold-item">
                        <span class="res-icon">💰</span>
                        <span class="res-value" id="gold-value">0</span>
                    </div>
                    <div class="res-item gem-item">
                        <span class="res-icon">💎</span>
                        <span class="res-value" id="gem-value">0</span>
                    </div>
                    <div class="res-item cash-item">
                        <span class="res-icon">💵</span>
                        <span class="res-value" id="cash-value">0</span>
                    </div>
                </div>
                <div class="header-gps">
                    <span id="gps-value">0</span>/秒
                </div>
                <button class="header-btn" id="btn-music" onclick="toggleMusic()">🔊</button>
            </div>

            <!-- 游戏场景 -->
            <div class="game-scene">
                <!-- 地面区域 -->
                <div class="surface-area">
                    <div class="sky-bg"></div>
                    <div class="cloud cloud1">☁️</div>
                    <div class="cloud cloud2">☁️</div>
                    <div class="mountain-bg">
                        <div class="mountain m1"></div>
                        <div class="mountain m2"></div>
                        <div class="mountain m3"></div>
                    </div>
                    <div class="ground-bg"></div>
                    <div class="grass-line"></div>
                    
                    <div class="surface-buildings">
                        <div class="tower tower-blue">
                            <div class="tower-roof"></div>
                            <div class="tower-body">
                                <div class="tower-window"></div>
                                <div class="tower-window"></div>
                            </div>
                            <div class="tower-base"></div>
                            <div class="tower-flag">🚩</div>
                            <div class="tower-level">L1</div>
                        </div>
                        <div class="tower tower-green">
                            <div class="tower-roof"></div>
                            <div class="tower-body">
                                <div class="tower-window"></div>
                                <div class="tower-window"></div>
                            </div>
                            <div class="tower-base"></div>
                            <div class="tower-flag">🚩</div>
                            <div class="tower-level">L2</div>
                        </div>
                    </div>

                    <div class="surface-workers">
                        <div class="sw-worker sprite sprite-ground_worker"></div>
                        <div class="sw-worker sprite sprite-miner_idle" style="animation-delay: 0.15s;"></div>
                        <div class="sw-worker sprite sprite-miner2_idle" style="animation-delay: 0.3s;"></div>
                    </div>

                    <div class="surface-cart">
                        <div class="mine-cart">
                            <div class="cart-body"></div>
                            <div class="cart-ore"></div>
                            <div class="cart-wheel w1"></div>
                            <div class="cart-wheel w2"></div>
                        </div>
                        <div class="cart-pusher sprite sprite-ground_worker"></div>
                    </div>

                    <div class="elevator-top">
                        <div class="elevator-top-building"></div>
                        <div class="elevator-top-sign">🛗</div>
                    </div>
                </div>

                <!-- 地下矿区 -->
                <div class="underground-area">
                    <!-- 左侧电梯井 -->
                    <div class="elevator-shaft">
                        <div class="shaft-wall left"></div>
                        <div class="shaft-wall right"></div>
                        <div class="shaft-ladder"></div>
                        <div class="shaft-cable"></div>
                        
                        <div class="shaft-lights">
                            <div class="shaft-light"></div>
                            <div class="shaft-light"></div>
                            <div class="shaft-light"></div>
                            <div class="shaft-light"></div>
                            <div class="shaft-light"></div>
                        </div>
                        
                        <div class="elevator-car" id="elevator-car">
                            <div class="elevator-roof"></div>
                            <div class="elevator-body">
                                <div class="elevator-door left-door" id="door-left"></div>
                                <div class="elevator-door right-door" id="door-right"></div>
                                <div class="elevator-worker-inside sprite sprite-elevator_worker"></div>
                            </div>
                            <div class="elevator-floor-indicator" id="elevator-floor">1F</div>
                        </div>
                    </div>

                    <!-- 矿层区域 -->
                    <div class="mine-layers" id="mine-layers"></div>
                </div>
            </div>

            <!-- 底部导航 -->
            <div class="bottom-nav">
                <button class="nav-btn active" data-panel="miners">
                    <span class="nav-icon">⛏️</span>
                    <span>矿工</span>
                </button>
                <button class="nav-btn" data-panel="elevator">
                    <span class="nav-icon">🛗</span>
                    <span>电梯</span>
                </button>
                <button class="nav-btn" data-panel="ground">
                    <span class="nav-icon">🏭</span>
                    <span>地面</span>
                </button>
                <button class="nav-btn" data-panel="mines">
                    <span class="nav-icon">⛰️</span>
                    <span>矿山</span>
                </button>
            </div>

            <!-- 升级面板 -->
            <div class="upgrade-panel" id="upgrade-panel">
                <div class="panel-header">
                    <h3 id="panel-title">矿工管理</h3>
                    <button class="panel-close" id="panel-close">✕</button>
                </div>
                <div class="panel-content" id="panel-content"></div>
            </div>

            <!-- 弹窗 -->
            <div class="modal-overlay" id="modal-overlay"></div>
            
            <div class="modal" id="settings-modal">
                <div class="modal-body">
                    <h3>⚙️ 设置</h3>
                    <div class="setting-row">
                        <span>背景音乐</span>
                        <button class="toggle-btn" onclick="toggleMusic()" id="setting-music-btn">🔊</button>
                    </div>
                    <div class="setting-row">
                        <span>音效</span>
                        <button class="toggle-btn" onclick="toggleSound()">🔊</button>
                    </div>
                    <button class="btn-danger" onclick="logout()">退出登录</button>
                </div>
            </div>

            <div class="modal" id="offline-modal">
                <div class="modal-body">
                    <div class="offline-icon">⏰</div>
                    <h3>欢迎回来！</h3>
                    <p>离线 <span id="offline-time">0</span> 分钟</p>
                    <p class="offline-gold">获得 <span id="offline-gold">0</span> 金币</p>
                    <button class="btn-primary" onclick="collectOffline()">💰 领取奖励</button>
                </div>
            </div>

            <!-- 特效层 -->
            <div class="effect-layer" id="effect-layer"></div>

            <div class="toast-container" id="toast-container"></div>
        </div>

        <audio id="bg-music" loop>
            <source src="https://assets.mixkit.co/music/preview/mixkit-game-level-up-2059.mp3" type="audio/mp3">
        </audio>
        
        <script src="game.js"></script>
    </div>
</body>
</html>
